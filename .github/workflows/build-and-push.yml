name: Build and Push Capacitor (Atlan fork)

on:
  push:
    branches:
      - atlan/subpath-support
    tags:
      - 'atlan-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to push (e.g. v0.4.6-subpath)"
        required: false
        default: "v0.4.6-subpath"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: atlanhq/capacitor
  VITE_BASE_PATH: /api/capacitor/

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine image tag
        id: meta
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v0.4.6-subpath"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${TAG}" >> $GITHUB_OUTPUT

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.atlan
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_BASE_PATH=${{ env.VITE_BASE_PATH }}
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print image digest
        run: echo "Pushed ${{ steps.meta.outputs.image }}"
